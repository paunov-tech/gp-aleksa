tronske pošte i sl.)."},{"besedilo_sl":"Lahko je v obliki arbitražne klavzule v pogodbi ali v obliki samostojnega sporazuma.","prevod_sr":"Može biti u obliku arbitražne klauzule u ugovoru ili u obliku samostalnog sporazuma.","pravilno":true,"razlaga_sr":"Tačno: ZArbit, 10. člen, 1. odst., druga rečenica."},{"besedilo_sl":"Je sporazum strank, da predložijo arbitraži v reševanje spore, ki so med njimi že nastali ali ki utegnejo nastati v zvezi z določenim pravnim razmerjem.","prevod_sr":"To je sporazum stranaka da arbitraži poveravaju na rešavanje sporove koji su među njima već nastali ili koji mogu nastati u vezi sa određenim pravnim odnosom.","pravilno":true,"razlaga_sr":"Tačno: ZArbit, 10. člen, 1. odst."},{"besedilo_sl":"Nanaša se lahko samo na spore iz pogodbenih pravnih razmerij.","prevod_sr":"Može se odnositi samo na sporove iz ugovornih pravnih odnosa.","pravilno":false,"razlaga_sr":"Netačno: odnosi se na sporove iz ugovornog ili vanugovornog pravnog odnosa (ZArbit, 10. člen, 1. odst.)."},{"besedilo_sl":"Veljaven je le, če je sklenjen v obliki notarskega zapisa.","prevod_sr":"Punovažan je samo ako je zaključen u obliku notarskog zapisa.","pravilno":false,"razlaga_sr":"Netačno: traži se pisani oblik, ne notarski zapis (ZArbit, 10. člen, 2. odst.)."}],"kljucne_besede_sl":["arbitražni sporazum","arbitražna klavzula","pisna oblika","arbitraža"],"vir":{"literatura_str":"","zakon_clen":"ZArbit, 10. člen, 1. in 2. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5288"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-039","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Arbitraža","tezina":2,"tip":"multi","vprasanje_sl":"Kaj je lahko po Zakonu o arbitraži predmet arbitražnega sporazuma (arbitrabilnost)?","prevod_sr":"Šta prema Zakonu o arbitraži može biti predmet arbitražnog sporazuma (arbitrabilnost)?","odgovori":[{"besedilo_sl":"Samo premoženjskopravni zahtevki, katerih vrednost ne presega 20.000 eurov.","prevod_sr":"Samo imovinskopravni zahtevi čija vrednost ne prelazi 20.000 evra.","pravilno":false,"razlaga_sr":"Netačno: ZArbit, 4. člen ne postavlja vrednosnu granicu; 20.000 evra je granica stvarne nadležnosti sudova (ZPP, 30. člen)."},{"besedilo_sl":"Samo nepremoženjski zahtevki.","prevod_sr":"Samo neimovinski zahtevi.","pravilno":false,"razlaga_sr":"Netačno: pre svega svaki imovinskopravni zahtev (ZArbit, 4. člen, 1. odst.)."},{"besedilo_sl":"Vsak zahtevek, tudi tak, glede katerega se stranke ne morejo poravnati.","prevod_sr":"Svaki zahtev, pa i onaj o kome se stranke ne mogu poravnati.","pravilno":false,"razlaga_sr":"Netačno: neimovinski zahtevi mogu biti predmet arbitraže samo ako se stranke o njima mogu poravnati (ZArbit, 4. člen, 1. odst.)."},{"besedilo_sl":"Vsak premoženjskopravni zahtevek, drugi zahtevki pa samo, če se stranke glede zahtevka lahko poravnajo.","prevod_sr":"Svaki imovinskopravni zahtev, a drugi zahtevi samo ako se stranke o zahtevu mogu poravnati.","pravilno":true,"razlaga_sr":"Tačno: ZArbit, 4. člen, 1. odst."},{"besedilo_sl":"Samo zahtevki iz gospodarskih pogodb med gospodarskimi družbami.","prevod_sr":"Samo zahtevi iz privrednih ugovora između privrednih društava.","pravilno":false,"razlaga_sr":"Netačno: predmet može biti svaki imovinskopravni zahtev, a arbitražni sporazum može zaključiti svako fizičko ili pravno lice (ZArbit, 4. člen)."}],"kljucne_besede_sl":["arbitrabilnost","premoženjskopravni zahtevek","poravnava"],"vir":{"literatura_str":"","zakon_clen":"ZArbit, 4. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5288"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-040","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Arbitraža","tezina":2,"tip":"multi","vprasanje_sl":"Katera trditev o arbitražni odločbi po Zakonu o arbitraži NI pravilna?","prevod_sr":"Koja tvrdnja o arbitražnoj odluci prema Zakonu o arbitraži NIJE tačna?","odgovori":[{"besedilo_sl":"Arbitražna odločba ima med strankami učinek pravnomočne sodbe.","prevod_sr":"Arbitražna odluka ima među strankama dejstvo pravosnažne presude.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZArbit, 38. člen), pa se ne označava."},{"besedilo_sl":"Domača arbitražna odločba se lahko izvrši, ko jo sodišče razglasi za izvršljivo.","prevod_sr":"Domaća arbitražna odluka može se izvršiti kada je sud proglasi izvršnom.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZArbit, 41. člen, 1. odst.), pa se ne označava."},{"besedilo_sl":"Stranke se lahko pravici do tožbe za razveljavitev arbitražne odločbe vnaprej odpovejo.","prevod_sr":"Stranke se mogu unapred odreći prava na tužbu za poništaj arbitražne odluke.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: stranke se tog prava ne mogu unapred odreći (ZArbit, 40. člen, 1. odst.)."},{"besedilo_sl":"Zoper arbitražno odločbo je dovoljena pritožba na višje sodišče.","prevod_sr":"Protiv arbitražne odluke dozvoljena je žalba višem sudu.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: arbitražna odluka se pred sudom može pobijati samo tužbom za poništaj („razveljavitev“) (ZArbit, 40. člen, 1. odst.)."},{"besedilo_sl":"Tožba za razveljavitev arbitražne odločbe se lahko vloži v 30 dneh od dneva, ko je stranka prejela odločbo.","prevod_sr":"Tužba za poništaj arbitražne odluke može se podneti u roku od 30 dana od dana kada je stranka primila odluku.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: rok je tri meseca od dana prijema arbitražne odluke (ZArbit, 40. člen, 3. odst.)."}],"kljucne_besede_sl":["arbitražna odločba","pravnomočna sodba","tožba za razveljavitev","izvršljivost"],"vir":{"literatura_str":"","zakon_clen":"ZArbit, 38. člen; 40. člen, 1. in 3. odst.; 41. člen, 1. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5288"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-041","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Arbitraža","tezina":3,"tip":"multi","vprasanje_sl":"Stranki sta v pogodbi veljavno dogovorili arbitražno klavzulo, ki jo je mogoče izpolniti. Kljub temu ena stranka vloži tožbo pri sodišču, tožena stranka pa v odgovoru na tožbo ugovarja, da je za spor dogovorjena arbitraža. Kako ravna sodišče po Zakonu o arbitraži?","prevod_sr":"Stranke su u ugovoru punovažno ugovorile arbitražnu klauzulu koju je moguće ispuniti. Uprkos tome jedna stranka podnese tužbu sudu, a tužena stranka u odgovoru na tužbu prigovori da je za spor ugovorena arbitraža. Kako postupa sud prema Zakonu o arbitraži?","odgovori":[{"besedilo_sl":"Za nepristojno se izreče po uradni dolžnosti, tudi če tožena stranka ne ugovarja.","prevod_sr":"Oglašava se nenadležnim po službenoj dužnosti, čak i ako tužena stranka ne prigovori.","pravilno":false,"razlaga_sr":"Netačno: sud se oglašava nenadležnim na prigovor tužene stranke (ZArbit, 11. člen, 1. odst.), ne po službenoj dužnosti."},{"besedilo_sl":"Postopek prekine do izdaje arbitražne odločbe.","prevod_sr":"Prekida postupak do donošenja arbitražne odluke.","pravilno":false,"razlaga_sr":"Netačno: zakon predviđa odbacivanje tužbe, ne prekid postupka (ZArbit, 11. člen, 1. odst.)."},{"besedilo_sl":"Tožbeni zahtevek zavrne kot neutemeljen.","prevod_sr":"Odbija tužbeni zahtev kao neosnovan.","pravilno":false,"razlaga_sr":"Netačno: sud ne odlučuje o osnovanosti, već odbacuje („zavrže“) tužbu (ZArbit, 11. člen, 1. odst.)."},{"besedilo_sl":"Nadaljuje postopek, ker arbitražni sporazum ne more izključiti pristojnosti sodišča.","prevod_sr":"Nastavlja postupak jer arbitražni sporazum ne može isključiti nadležnost suda.","pravilno":false,"razlaga_sr":"Netačno: kod punovažnog arbitražnog sporazuma sud se na prigovor oglašava nenadležnim (ZArbit, 11. člen, 1. odst.)."},{"besedilo_sl":"Na ugovor tožene stranke se izreče za nepristojno, razveljavi v postopku opravljena dejanja in zavrže tožbo.","prevod_sr":"Na prigovor tužene stranke oglašava se nenadležnim, ukida radnje sprovedene u postupku i odbacuje tužbu.","pravilno":true,"razlaga_sr":"Tačno: ZArbit, 11. člen, 1. odst.; prigovor se može dati najkasnije u odgovoru na tužbu (2. odst.)."}],"kljucne_besede_sl":["arbitražna klavzula","ugovor tožene stranke","zavrženje tožbe","nepristojnost sodišča"],"vir":{"literatura_str":"","zakon_clen":"ZArbit, 11. člen, 1. in 2. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5288"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-042","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Arbitraža","tezina":2,"tip":"multi","vprasanje_sl":"Katera trditev o arbitražnem postopku po Zakonu o arbitraži NI pravilna?","prevod_sr":"Koja tvrdnja o arbitražnom postupku prema Zakonu o arbitraži NIJE tačna?","odgovori":[{"besedilo_sl":"Če stranke ne določijo števila arbitrov, odloča arbiter posameznik.","prevod_sr":"Ako stranke ne odrede broj arbitara, odlučuje arbitar pojedinac.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: ako stranke ne odrede broj, arbitara je troje (ZArbit, 13. člen, 2. odst.)."},{"besedilo_sl":"Arbitražna klavzula, vsebovana v pogodbi, šteje za neodvisen del te pogodbe.","prevod_sr":"Arbitražna klauzula sadržana u ugovoru smatra se nezavisnim delom tog ugovora.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZArbit, 19. člen, 1. odst.), pa se ne označava."},{"besedilo_sl":"Arbitražni senat mora arbitražno odločbo vedno sprejeti soglasno.","prevod_sr":"Arbitražno veće mora arbitražnu odluku uvek doneti jednoglasno.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: odluka se donosi većinom glasova članova veća, ako se stranke nisu drugačije sporazumele (ZArbit, 33. člen)."},{"besedilo_sl":"Število arbitrov določijo stranke.","prevod_sr":"Broj arbitara određuju stranke.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZArbit, 13. člen, 1. odst.), pa se ne označava."},{"besedilo_sl":"Arbitražni senat lahko vedno odloči po pravičnosti (ex aequo et bono).","prevod_sr":"Arbitražno veće može uvek odlučiti po pravičnosti (ex aequo et bono).","pravilno":true,"razlaga_sr":"Označava se jer je netačna: po pravičnosti može odlučiti samo na osnovu izričitog ovlašćenja stranaka (ZArbit, 32. člen, 3. odst.)."}],"kljucne_besede_sl":["arbitražni senat","arbiter","odločanje po pravičnosti","arbitražna klavzula"],"vir":{"literatura_str":"","zakon_clen":"ZArbit, 13. člen; 19. člen, 1. odst.; 32. člen, 3. odst.; 33. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5288"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-043","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Mediacija","tezina":1,"tip":"multi","vprasanje_sl":"Kaj velja za mediacijo po Zakonu o mediaciji v civilnih in gospodarskih zadevah?","prevod_sr":"Šta važi za medijaciju prema Zakonu o medijaciji u građanskim i privrednim stvarima?","odgovori":[{"besedilo_sl":"Mediator o sporu izda odločbo, ki stranki zavezuje.","prevod_sr":"Medijator o sporu donosi odluku koja obavezuje stranke.","pravilno":false,"razlaga_sr":"Netačno: medijator ne odlučuje; može davati predloge, koji stranke ne obavezuju (ZMCGZ, 8. člen, 4. odst.)."},{"besedilo_sl":"Rešitev, ki jo predlaga mediator, strank ne zavezuje.","prevod_sr":"Rešenje koje predloži medijator ne obavezuje stranke.","pravilno":true,"razlaga_sr":"Tačno: ZMCGZ, 8. člen, 4. odst."},{"besedilo_sl":"Mediator je lahko samo sodnik ali odvetnik.","prevod_sr":"Medijator može biti samo sudija ili advokat.","pravilno":false,"razlaga_sr":"Netačno: medijator je svako treće lice zamoljeno da vodi medijaciju, bez obzira na zvanje ili zanimanje (ZMCGZ, 3. člen, 1. odst., tačka b)."},{"besedilo_sl":"V postopku lahko vedno sodeluje samo en mediator.","prevod_sr":"U postupku uvek može učestvovati samo jedan medijator.","pravilno":false,"razlaga_sr":"Netačno: u postupku može učestvovati jedan ili više medijatora (ZMCGZ, 3. člen, 1. odst., tačka b)."},{"besedilo_sl":"Je postopek, v katerem stranke prostovoljno s pomočjo nevtralne tretje osebe (mediatorja) skušajo doseči mirno rešitev spora.","prevod_sr":"To je postupak u kome stranke dobrovoljno, uz pomoć neutralnog trećeg lica (medijatora), nastoje da postignu mirno rešenje spora.","pravilno":true,"razlaga_sr":"Tačno: ZMCGZ, 3. člen, 1. odst., tačka a)."}],"kljucne_besede_sl":["mediacija","mediator","mirna rešitev spora","prostovoljnost"],"vir":{"literatura_str":"","zakon_clen":"ZMCGZ, 3. člen, 1. odst.; 8. člen, 4. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5289"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-044","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Mediacija","tezina":2,"tip":"multi","vprasanje_sl":"Katera trditev o zaupnosti v mediaciji po Zakonu o mediaciji v civilnih in gospodarskih zadevah NI pravilna?","prevod_sr":"Koja tvrdnja o poverljivosti u medijaciji prema Zakonu o medijaciji u građanskim i privrednim stvarima NIJE tačna?","odgovori":[{"besedilo_sl":"Dokaz, ki je sicer dopusten v sodnem postopku, postane nedopusten že zato, ker je bil uporabljen v mediaciji.","prevod_sr":"Dokaz koji je inače dopušten u sudskom postupku postaje nedopušten već zato što je korišćen u medijaciji.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: inače dopušteni dokazi ne postaju nedopušteni samo zato što su korišćeni u medijaciji (ZMCGZ, 12. člen, 5. odst.)."},{"besedilo_sl":"Vsi podatki, ki izvirajo iz mediacije ali so z njo povezani, so zaupni, razen če so se stranke sporazumele drugače.","prevod_sr":"Svi podaci koji potiču iz medijacije ili su sa njom povezani poverljivi su, osim ako su se stranke drugačije sporazumele.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZMCGZ, 11. člen), pa se ne označava."},{"besedilo_sl":"Mediator sme podatke, ki mu jih je stranka razkrila pod izrecnim pogojem, da ostanejo zaupni, razkriti drugi stranki.","prevod_sr":"Medijator sme podatke koje mu je stranka otkrila pod izričitim uslovom da ostanu poverljivi otkriti drugoj stranci.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: takve podatke medijator ne sme otkriti drugim strankama (ZMCGZ, 10. člen)."},{"besedilo_sl":"Podatki se smejo razkriti, če je to potrebno za izpolnitev ali prisilno izvršitev sporazuma o rešitvi spora.","prevod_sr":"Podaci se smeju otkriti ako je to potrebno za ispunjenje ili prinudno izvršenje sporazuma o rešenju spora.","pravilno":false,"razlaga_sr":"Ova tvrdnja je tačna (ZMCGZ, 11. člen), pa se ne označava."},{"besedilo_sl":"Stranka se sme v poznejši pravdi kot na dokaz sklicevati na priznanje dejstev, ki ga je nasprotna stranka dala med mediacijo.","prevod_sr":"Stranka se u kasnijoj parnici sme kao na dokaz pozvati na priznanje činjenica koje je suprotna stranka dala tokom medijacije.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: na izjave ili priznanja činjenica data tokom medijacije stranke se ne smeju pozivati niti ih predlagati kao dokaz (ZMCGZ, 12. člen, 1. odst., tačka c)."}],"kljucne_besede_sl":["zaupnost","mediacija","dopustnost dokazov","sporazum o rešitvi spora"],"vir":{"literatura_str":"","zakon_clen":"ZMCGZ, 10. člen; 11. člen; 12. člen, 1. in 5. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5289"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-045","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Mediacija","tezina":2,"tip":"multi","vprasanje_sl":"Kako mediacija po Zakonu o mediaciji v civilnih in gospodarskih zadevah vpliva na zastaranje zahtevka, ki je predmet mediacije?","prevod_sr":"Kako medijacija prema Zakonu o medijaciji u građanskim i privrednim stvarima utiče na zastarelost zahteva koji je predmet medijacije?","odgovori":[{"besedilo_sl":"Zastaranje ne teče le, če mediacijo vodi sodnik.","prevod_sr":"Zastarelost ne teče samo ako medijaciju vodi sudija.","pravilno":false,"razlaga_sr":"Netačno: ZMCGZ, 17. člen ne postavlja takav uslov; zastarelost ne teče tokom svake medijacije o tom zahtevu."},{"besedilo_sl":"Zastaranje med trajanjem mediacije ne teče.","prevod_sr":"Zastarelost tokom trajanja medijacije ne teče.","pravilno":true,"razlaga_sr":"Tačno: ZMCGZ, 17. člen, 1. odst. (zastoj zastarelosti)."},{"besedilo_sl":"Mediacija na tek zastaranja nima vpliva.","prevod_sr":"Medijacija nema uticaja na tok zastarelosti.","pravilno":false,"razlaga_sr":"Netačno: tokom medijacije zastarelost ne teče (ZMCGZ, 17. člen, 1. odst.)."},{"besedilo_sl":"Zastaranje se z začetkom mediacije pretrga in po njenem koncu začne teči znova.","prevod_sr":"Zastarelost se početkom medijacije prekida i po njenom okončanju počinje da teče iznova.","pravilno":false,"razlaga_sr":"Netačno: zastarelost ne teče (zastoj), a posle neuspele medijacije se nastavlja; vreme proteklo pre početka medijacije uračunava se u rok (ZMCGZ, 17. člen, 1. i 2. odst.)."},{"besedilo_sl":"Če se mediacija konča brez sporazuma, se čas, ki je pretekel pred začetkom mediacije, ne všteje v zastaralni rok.","prevod_sr":"Ako se medijacija okonča bez sporazuma, vreme proteklo pre početka medijacije ne uračunava se u rok zastarelosti.","pravilno":false,"razlaga_sr":"Netačno: vreme proteklo pre početka medijacije uračunava se u zakonski rok zastarelosti (ZMCGZ, 17. člen, 2. odst.)."}],"kljucne_besede_sl":["zastaranje","mediacija","zastaralni rok"],"vir":{"literatura_str":"","zakon_clen":"ZMCGZ, 17. člen, 1. in 2. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5289"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-046","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Mediacija","tezina":3,"tip":"multi","vprasanje_sl":"V mediaciji med dvema strankama ena stranka pisno izjavi drugi stranki in mediatorju, da je postopek zaključen. Kaj velja po Zakonu o mediaciji v civilnih in gospodarskih zadevah?","prevod_sr":"U medijaciji između dve stranke jedna stranka pismeno izjavi drugoj stranci i medijatoru da je postupak završen. Šta važi prema Zakonu o medijaciji u građanskim i privrednim stvarima?","odgovori":[{"besedilo_sl":"Izjava nima učinka, ker morata stranki v mediaciji vztrajati do sklenitve sporazuma.","prevod_sr":"Izjava nema dejstvo jer stranke moraju istrajati u medijaciji do zaključenja sporazuma.","pravilno":false,"razlaga_sr":"Netačno: medijacija je dobrovoljna (ZMCGZ, 3. člen, 1. odst., tačka a; 4. člen, 2. odst.) i okončava se izjavom stranke (13. člen, tačka e)."},{"besedilo_sl":"Mediacija se nadaljuje, dokler se z zaključkom ne strinja tudi druga stranka.","prevod_sr":"Medijacija se nastavlja dok se sa završetkom ne saglasi i druga stranka.","pravilno":false,"razlaga_sr":"Netačno: dovoljna je pisana izjava jedne stranke drugim strankama i medijatoru (ZMCGZ, 13. člen, tačka e)."},{"besedilo_sl":"Mediacija se konča z dnem te izjave.","prevod_sr":"Medijacija se okončava danom te izjave.","pravilno":true,"razlaga_sr":"Tačno: ZMCGZ, 13. člen, tačka e)."},{"besedilo_sl":"Mediacija se konča šele, ko mediator izda sklep o ustavitvi postopka.","prevod_sr":"Medijacija se okončava tek kada medijator donese rešenje o obustavi postupka.","pravilno":false,"razlaga_sr":"Netačno: ZMCGZ, 13. člen ne predviđa rešenje medijatora; medijacija se okončava danom izjave stranke."},{"besedilo_sl":"Mediacija se konča po izteku 30 dni od te izjave.","prevod_sr":"Medijacija se okončava po isteku 30 dana od te izjave.","pravilno":false,"razlaga_sr":"Netačno: okončava se danom izjave (ZMCGZ, 13. člen, tačka e); rok od 30 dana odnosi se na nesporazum o imenovanju medijatora (tačka b)."}],"kljucne_besede_sl":["konec mediacije","pisna izjava","prostovoljno sodelovanje"],"vir":{"literatura_str":"","zakon_clen":"ZMCGZ, 3. člen; 4. člen, 2. odst.; 13. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO5289"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-047","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Pravni akti Evropske unije","tezina":1,"tip":"multi","vprasanje_sl":"Katere akte sprejemajo institucije Unije za izvajanje pristojnosti Unije po 288. členu PDEU?","prevod_sr":"Koje akte donose institucije Unije radi vršenja nadležnosti Unije prema članu 288. UFEU?","odgovori":[{"besedilo_sl":"Ustavne zakone.","prevod_sr":"Ustavne zakone.","pravilno":false,"razlaga_sr":"Netačno: PDEU, člen 288 navodi uredbe, direktive, odluke, preporuke i mišljenja; ustavni zakon je akt slovenačkog prava."},{"besedilo_sl":"Direktive.","prevod_sr":"Direktive.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 1. odst."},{"besedilo_sl":"Uredbe.","prevod_sr":"Uredbe.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 1. odst."},{"besedilo_sl":"Priporočila in mnenja.","prevod_sr":"Preporuke i mišljenja.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 1. odst.; preporuke i mišljenja nisu obavezujući (5. odst.)."},{"besedilo_sl":"Sklepe.","prevod_sr":"Odluke.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 1. odst. („sklep“ = odluka)."}],"kljucne_besede_sl":["uredba","direktiva","sklep","priporočilo","mnenje"],"vir":{"literatura_str":"","zakon_clen":"PDEU, člen 288","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016E/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-048","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Pravni akti Evropske unije","tezina":1,"tip":"multi","vprasanje_sl":"Kaj velja za uredbo po 288. členu PDEU?","prevod_sr":"Šta važi za uredbu prema članu 288. UFEU?","odgovori":[{"besedilo_sl":"Splošno se uporablja in je zavezujoča v celoti.","prevod_sr":"Ima opštu primenu i obavezujuća je u celini.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 2. odst."},{"besedilo_sl":"Zavezujoča je samo za tiste, na katere je naslovljena.","prevod_sr":"Obavezujuća je samo za one kojima je upućena.","pravilno":false,"razlaga_sr":"Netačno: to važi za odluku („sklep“) koja određuje adresate (PDEU, člen 288, 4. odst.); uredba ima opštu primenu."},{"besedilo_sl":"Zavezujoča je le glede cilja, izbiro oblike in metod pa prepušča nacionalnim organom.","prevod_sr":"Obavezujuća je samo u pogledu cilja, a izbor oblika i metoda prepušta nacionalnim organima.","pravilno":false,"razlaga_sr":"Netačno: to je opis direktive (PDEU, člen 288, 3. odst.)."},{"besedilo_sl":"Ni zavezujoča.","prevod_sr":"Nije obavezujuća.","pravilno":false,"razlaga_sr":"Netačno: neobavezujući su preporuke i mišljenja (PDEU, člen 288, 5. odst.); uredba je obavezujuća u celini."},{"besedilo_sl":"Neposredno se uporablja v vseh državah članicah.","prevod_sr":"Neposredno se primenjuje u svim državama članicama.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 2. odst."}],"kljucne_besede_sl":["uredba","neposredna uporaba","država članica","zavezujoč"],"vir":{"literatura_str":"","zakon_clen":"PDEU, člen 288, 2.–5. odst.","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016E/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-049","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Pravni akti Evropske unije","tezina":2,"tip":"multi","vprasanje_sl":"Kaj velja za direktivo po 288. členu PDEU?","prevod_sr":"Šta važi za direktivu prema članu 288. UFEU?","odgovori":[{"besedilo_sl":"Nacionalnim organom prepušča izbiro oblike in metod.","prevod_sr":"Nacionalnim organima prepušta izbor oblika i metoda.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 3. odst."},{"besedilo_sl":"Ni zavezujoča, državam članicam le priporoča določeno ravnanje.","prevod_sr":"Nije obavezujuća, državama članicama samo preporučuje određeno postupanje.","pravilno":false,"razlaga_sr":"Netačno: direktiva je obavezujuća u pogledu cilja (PDEU, člen 288, 3. odst.); neobavezujuće su preporuke i mišljenja (5. odst.)."},{"besedilo_sl":"Državam članicam natančno predpiše tudi obliko in metode za dosego cilja.","prevod_sr":"Državama članicama tačno propisuje i oblik i metode za postizanje cilja.","pravilno":false,"razlaga_sr":"Netačno: izbor oblika i metoda prepušten je nacionalnim organima (PDEU, člen 288, 3. odst.)."},{"besedilo_sl":"Za vsako državo članico, na katero je naslovljena, je zavezujoča glede cilja, ki ga je treba doseči.","prevod_sr":"Za svaku državu članicu kojoj je upućena obavezujuća je u pogledu cilja koji treba postići.","pravilno":true,"razlaga_sr":"Tačno: PDEU, člen 288, 3. odst."},{"besedilo_sl":"Zavezujoča je v celoti in se neposredno uporablja v vseh državah članicah.","prevod_sr":"Obavezujuća je u celini i neposredno se primenjuje u svim državama članicama.","pravilno":false,"razlaga_sr":"Netačno: to je opis uredbe (PDEU, člen 288, 2. odst.)."}],"kljucne_besede_sl":["direktiva","cilj","oblika in metode","nacionalni organi"],"vir":{"literatura_str":"","zakon_clen":"PDEU, člen 288, 2., 3. in 5. odst.","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016E/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-050","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Pravni akti Evropske unije","tezina":1,"tip":"multi","vprasanje_sl":"Kateri od navedenih aktov Unije po 288. členu PDEU NISO zavezujoči?","prevod_sr":"Koji od navedenih akata Unije prema članu 288. UFEU NISU obavezujući?","odgovori":[{"besedilo_sl":"Direktive.","prevod_sr":"Direktive.","pravilno":false,"razlaga_sr":"Ne označava se: direktiva je obavezujuća u pogledu cilja (PDEU, člen 288, 3. odst.)."},{"besedilo_sl":"Priporočila.","prevod_sr":"Preporuke.","pravilno":true,"razlaga_sr":"Označava se: preporuke nisu obavezujuće (PDEU, člen 288, 5. odst.)."},{"besedilo_sl":"Sklepi.","prevod_sr":"Odluke.","pravilno":false,"razlaga_sr":"Ne označava se: odluka („sklep“) je u celini obavezujuća (PDEU, člen 288, 4. odst.)."},{"besedilo_sl":"Mnenja.","prevod_sr":"Mišljenja.","pravilno":true,"razlaga_sr":"Označava se: mišljenja nisu obavezujuća (PDEU, člen 288, 5. odst.)."},{"besedilo_sl":"Uredbe.","prevod_sr":"Uredbe.","pravilno":false,"razlaga_sr":"Ne označava se: uredba je obavezujuća u celini (PDEU, člen 288, 2. odst.)."}],"kljucne_besede_sl":["priporočilo","mnenje","zavezujoč akt"],"vir":{"literatura_str":"","zakon_clen":"PDEU, člen 288","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016E/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-051","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Pravni akti Evropske unije","tezina":3,"tip":"multi","vprasanje_sl":"Evropski parlament in Svet želita sprejeti pravilo, ki bo v celoti zavezujoče in se bo neposredno uporabljalo v vseh državah članicah. Kateri akt iz 288. člena PDEU ustreza temu opisu?","prevod_sr":"Evropski parlament i Savet žele da donesu pravilo koje će biti u celini obavezujuće i neposredno se primenjivati u svim državama članicama. Koji akt iz člana 288. UFEU odgovara tom opisu?","odgovori":[{"besedilo_sl":"Priporočilo.","prevod_sr":"Preporuka.","pravilno":false,"razlaga_sr":"Netačno: preporuka nije obavezujuća (PDEU, člen 288, 5. odst.)."},{"besedilo_sl":"Direktiva.","prevod_sr":"Direktiva.","pravilno":false,"razlaga_sr":"Netačno: direktiva obavezuje samo u pogledu cilja, a oblik i metode prepušta nacionalnim organima (PDEU, člen 288, 3. odst.)."},{"besedilo_sl":"Mnenje.","prevod_sr":"Mišljenje.","pravilno":false,"razlaga_sr":"Netačno: mišljenje nije obavezujuće (PDEU, člen 288, 5. odst.)."},{"besedilo_sl":"Sklep, naslovljen na eno državo članico.","prevod_sr":"Odluka upućena jednoj državi članici.","pravilno":false,"razlaga_sr":"Netačno: odluka koja određuje adresate obavezuje samo njih (PDEU, člen 288, 4. odst.), ne sve države članice."},{"besedilo_sl":"Uredba.","prevod_sr":"Uredba.","pravilno":true,"razlaga_sr":"Tačno: uredba ima opštu primenu, obavezujuća je u celini i neposredno se primenjuje u svim državama članicama (PDEU, člen 288, 2. odst.)."}],"kljucne_besede_sl":["uredba","neposredna uporaba","sklep","direktiva"],"vir":{"literatura_str":"","zakon_clen":"PDEU, člen 288","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016E/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-052","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Institucije Evropske unije","tezina":1,"tip":"multi","vprasanje_sl":"Katere od navedenih so po 13. členu PEU institucije Unije?","prevod_sr":"Koje od navedenih su prema članu 13. UEU institucije Unije?","odgovori":[{"besedilo_sl":"Evropska centralna banka.","prevod_sr":"Evropska centralna banka.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 13, 1. odst."},{"besedilo_sl":"Evropski svet.","prevod_sr":"Evropski savet.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 13, 1. odst. (Evropski svet ≠ Svet)."},{"besedilo_sl":"Sodišče Evropske unije.","prevod_sr":"Sud Evropske unije.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 13, 1. odst."},{"besedilo_sl":"Odbor regij.","prevod_sr":"Komitet regiona.","pravilno":false,"razlaga_sr":"Netačno: Komitet regiona (kao i Ekonomsko-socijalni komitet) samo pomaže Parlamentu, Savetu i Komisiji i ima savetodavnu funkciju (PEU, člen 13, 4. odst.); nije na listi institucija."},{"besedilo_sl":"Evropski parlament.","prevod_sr":"Evropski parlament.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 13, 1. odst."}],"kljucne_besede_sl":["institucije Unije","Evropski parlament","Evropski svet","Sodišče Evropske unije","Odbor regij"],"vir":{"literatura_str":"","zakon_clen":"PEU, člen 13, 1. in 4. odst.","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016M/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-053","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Načela delitve pristojnosti v EU","tezina":2,"tip":"multi","vprasanje_sl":"Katere trditve o pristojnostih Unije so po 5. členu PEU pravilne?","prevod_sr":"Koje tvrdnje o nadležnostima Unije su prema članu 5. UEU tačne?","odgovori":[{"besedilo_sl":"Za razmejitev pristojnosti Unije velja načelo prenosa pristojnosti.","prevod_sr":"Za razgraničenje nadležnosti Unije važi načelo prenosa (dodeljivanja) nadležnosti.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 5, 1. odst."},{"besedilo_sl":"Načelo subsidiarnosti velja na področjih, ki so v izključni pristojnosti Unije.","prevod_sr":"Načelo supsidijarnosti važi u oblastima koje su u isključivoj nadležnosti Unije.","pravilno":false,"razlaga_sr":"Netačno: supsidijarnost važi u oblastima koje nisu u isključivoj nadležnosti Unije (PEU, člen 5, 3. odst.)."},{"besedilo_sl":"Unija lahko deluje na vseh področjih, razen če ji Pogodbi to izrecno prepovedujeta.","prevod_sr":"Unija može delovati u svim oblastima, osim ako joj Ugovori to izričito zabranjuju.","pravilno":false,"razlaga_sr":"Netačno: obrnuto – Unija deluje samo u granicama nadležnosti koje su joj Ugovorima prenele države članice (PEU, člen 5, 2. odst.)."},{"besedilo_sl":"Za izvajanje pristojnosti Unije veljata načeli subsidiarnosti in sorazmernosti.","prevod_sr":"Za vršenje nadležnosti Unije važe načela supsidijarnosti i srazmernosti.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 5, 1. odst."},{"besedilo_sl":"Države članice ohranijo vse pristojnosti, ki niso s Pogodbama dodeljene Uniji.","prevod_sr":"Države članice zadržavaju sve nadležnosti koje Ugovorima nisu dodeljene Uniji.","pravilno":true,"razlaga_sr":"Tačno: PEU, člen 5, 2. odst.; isto člen 4, 1. odst."}],"kljucne_besede_sl":["načelo prenosa pristojnosti","načelo subsidiarnosti","načelo sorazmernosti","izključna pristojnost"],"vir":{"literatura_str":"","zakon_clen":"PEU, člen 4, 1. odst.; člen 5","url":"https://eur-lex.europa.eu/legal-content/SL/TXT/HTML/?uri=CELEX:12016M/TXT"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T1-054","tema":"1 Temeljni pravni pojmi in pravni sistem","podtema":"Institucije Evropske unije","tezina":2,"tip":"multi","vprasanje_sl":"Katera trditev o institucijah Unije po PEU NI pravilna?","prevod_sr":"Koja tvrdnja o institucijama Unije prema UEU NIJE tačna?","odgovori":[{"besedilo_sl":"Evropski svet sestavljajo ministri držav članic.","prevod_sr":"Evropski savet čine ministri država članica.","pravilno":true,"razlaga_sr":"Označava se jer je netačna: Evropski savet čine šefovi država ili vlada država članica, njegov predsednik i predsednik Komisije (PEU, člen 15, 2. odst.); ministri čine Savet (člen 16, 2. odst.)."},{"besedi ljen 1. marca. Družba 10. marca opravi pravno dejanje nasproti poslovnemu partnerju, ki za spremembo ni vedel. Ali se partner lahko sklicuje na to, da vpisanega in objavljenega podatka ni poznal?","prevod_sr":"Upis novog zastupnika društva objavljen je 1. marta. Društvo 10. marta preduzme pravnu radnju prema poslovnom partneru koji za promenu nije znao. Može li se partner pozvati na to da upisani i objavljeni podatak nije poznavao?","odgovori":[{"besedilo_sl":"Da, in sicer brez dokazovanja, ker mora družba dokazati, da je partner za podatek vedel.","prevod_sr":"Da, i to bez dokazivanja, jer društvo mora dokazati da je partner za podatak znao.","pravilno":false,"razlaga_sr":"Netačno: teret dokaza je na trećem licu – ono mora dokazati da nije znalo niti moglo znati (ZSReg, 8. člen, 6. odst.)."},{"besedilo_sl":"Ne, ker se od dneva objave vpisa nihče v nobenem primeru ne more sklicevati na to, da podatka ni poznal.","prevod_sr":"Ne, jer se od dana objave upisa niko ni u kom slučaju ne može pozivati na to da podatak nije poznavao.","pravilno":false,"razlaga_sr":"Netačno: pravilo iz 8. člana, 5. odst. ima izuzetak za radnje u prvih 15 dana od objave (ZSReg, 8. člen, 6. odst.)."},{"besedilo_sl":"Da, ker je bilo dejanje opravljeno v petnajstih dneh od objave vpisa, vendar le, če dokaže, da za podatek ni vedel in tudi ni mogel vedeti.","prevod_sr":"Da, jer je radnja preduzeta u roku od petnaest dana od objave upisa, ali samo ako dokaže da za podatak nije znao niti je mogao znati.","pravilno":true,"razlaga_sr":"Tačno: ZSReg, 8. člen, 6. odst. – kod radnji u roku od 15 dana od objave treći se može pozvati na nepoznavanje ako dokaže da nije znao niti mogao znati."},{"besedilo_sl":"Da, ker vpis učinkuje nasproti tretjim šele po treh mesecih od objave.","prevod_sr":"Da, jer upis deluje prema trećima tek posle tri meseca od objave.","pravilno":false,"razlaga_sr":"Netačno: upis deluje prema trećima od dana objave (ZSReg, 8. člen, 1. odst.)."},{"besedilo_sl":"Ne, ker je rok, v katerem se tretji lahko sklicuje na nepoznavanje, osem dni od objave.","prevod_sr":"Ne, jer je rok u kojem se treći može pozvati na nepoznavanje osam dana od objave.","pravilno":false,"razlaga_sr":"Netačno: rok je petnaest dana od objave (ZSReg, 8. člen, 6. odst.)."}],"kljucne_besede_sl":["objava vpisa","tretja oseba","petnajst dni","dokazno breme"],"vir":{"literatura_str":"","zakon_clen":"ZSReg, 8. člen, 1., 5. in 6. odst.","url":"https://pisrs.si/pregledPredpisa?id=ZAKO320"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T2-039","tema":"2 Statusno pravo – splošni del","podtema":"Prijava za vpis v register","tezina":2,"tip":"multi","vprasanje_sl":"Kaj velja za prijavo za prvi vpis družbe v register?","prevod_sr":"Šta važi za prijavu za prvi upis društva u registar?","odgovori":[{"besedilo_sl":"Prijavo je treba vložiti v 30 dneh po sklenitvi akta o ustanovitvi.","prevod_sr":"Prijava se mora podneti u roku od 30 dana od zaključenja osnivačkog akta.","pravilno":false,"razlaga_sr":"Netačno: rok je 15 dana od ispunjenja uslova za upis (ZGD-1, 47. člen, 3. odst.)."},{"besedilo_sl":"Prijavo vloži oseba, ki je po zakonu ali aktih družbe upravičena za zastopanje, če zakon ne določa drugače.","prevod_sr":"Prijavu podnosi lice koje je po zakonu ili aktima društva ovlašćeno za zastupanje, ako zakon ne određuje drugačije.","pravilno":true,"razlaga_sr":"Tačno: ZGD-1, 46. člen."},{"besedilo_sl":"Prijavo je treba vložiti v 15 dneh po izpolnitvi pogojev za vpis v register.","prevod_sr":"Prijava se mora podneti u roku od 15 dana od ispunjenja uslova za upis u registar.","pravilno":true,"razlaga_sr":"Tačno: ZGD-1, 47. člen, 3. odst.; isti rok ZSReg, 3. člen, 3. odst."},{"besedilo_sl":"Prijava mora vsebovati firmo, dejavnost, sedež, poslovni in elektronski naslov ter druge podatke, določene z zakonom.","prevod_sr":"Prijava mora sadržati firmu, delatnost, sedište, poslovnu i elektronsku adresu i druge podatke određene zakonom.","pravilno":true,"razlaga_sr":"Tačno: ZGD-1, 47. čl  izpolnitev šele potem, ko je glavni dolžnik ne izpolni v roku, ki je določen v pisni zahtevi.","prevod_sr":"Kod supsidijarnog jemstva od jemca se može zahtevati ispunjenje tek pošto glavni dužnik ne ispuni obavezu u roku određenom u pismenom zahtevu.","pravilno":true,"razlaga_sr":"Tačno: OZ, 1019. člen, 1. odst."},{"besedilo_sl":"Pri solidarnem poroštvu mora upnik izpolnitev najprej pisno zahtevati od glavnega dolžnika.","prevod_sr":"Kod solidarnog jemstva poverilac mora ispunjenje najpre pismeno zahtevati od glavnog dužnika.","pravilno":false,"razlaga_sr":"Netačno: može zahtevati od glavnog dužnika, od jemca ili od obojice istovremeno (OZ, 1019. člen, 3. odst.)."}],"kljucne_besede_sl":["subsidiarno poroštvo","solidarno poroštvo","porok in plačnik"],"vir":{"literatura_str":"zapiski Tutorji EPF: vprasanja_2.txt, vpr. 11; vprasanja_3.txt, vpr. 12 in 36","zakon_clen":"OZ, 1019. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO1263"},"poreklo":"po_zapiskih","preverjeno":true},{"id":"T5-023","tema":"5 Obveznosti – odškodnina, zavarovanje, prenehanje, spremembe strank in stvarno pravo","podtema":"Poroštvo","tezina":3,"tip":"multi","vprasanje_sl":"Družba B, d. o. o., je s pisno izjavo prevzela poroštvo za obveznost družbe C, d. o. o., iz pogodbe o dobavi blaga, ki jo je ta sklenila z družbo D, d. d. O obliki poroštva ni bilo dogovorjeno nič posebnega. Od koga lahko družba D po zapadlosti zahteva izpolnitev?","prevod_sr":"Društvo B, d. o. o., je pismenom izjavom preuzelo jemstvo za obavezu društva C, d. o. o., iz ugovora o isporuci robe koji je ono zaključilo sa društvom D, d. d. O obliku jemstva nije ništa posebno ugovoreno. Od koga društvo D po dospelosti može zahtevati ispunjenje?","odgovori":[{"besedilo_sl":"Od družbe B šele potem, ko družba C ne izpolni v roku iz pisne zahteve.","prevod_sr":"Od društva B tek pošto društvo C ne ispuni u roku iz pismenog zahteva.","pravilno":false,"razlaga_sr":"Netačno: to je pravilo supsidijarnog jemstva; kod privrednog ugovora jemac odgovara kao jemac platac (OZ, 1019. člen, 1. in 4. odst.)."},{"besedilo_sl":"Samo od družbe C, ker poroštvo med gospodarskimi subjekti ni dopustno.","prevod_sr":"Samo od društva C, jer jemstvo između privrednih subjekata nije dopušteno.","pravilno":false,"razlaga_sr":"Netačno: jemstvo se može dati za svaku punovažnu obavezu; za privredne ugovore OZ čak predviđa solidarno jemstvo (OZ, 1016. člen, 1. odst.; 1019. člen, 4. odst.)."},{"besedilo_sl":"Samo od družbe B, ker je glavni dolžnik s poroštvom prost obveznosti.","prevod_sr":"Samo od društva B, jer je glavni dužnik jemstvom oslobođen obaveze.","pravilno":false,"razlaga_sr":"Netačno: jemac odgovara pored dužnika; poverilac može zahtevati i od glavnog dužnika (OZ, 1012. člen; 1019. člen, 3. odst.)."},{"besedilo_sl":"Od družbe B šele, ko je družba C v stečaju.","prevod_sr":"Od društva B tek kada je društvo C u stečaju.","pravilno":false,"razlaga_sr":"Netačno: stečaj glavnog dužnika je izuzetak kod supsidijarnog jemstva; ovde je jemstvo solidarno (OZ, 1019. člen, 2. in 4. odst.)."},{"besedilo_sl":"Od družbe C, od družbe B ali od obeh hkrati.","prevod_sr":"Od društva C, od društva B ili od oba istovremeno.","pravilno":true,"razlaga_sr":"Tačno: za obavezu iz privrednog ugovora jemac odgovara kao jemac platac (solidarno), ako nije drugačije ugovoreno (OZ, 1019. člen, 3. in 4. odst.; 13. člen)."}],"kljucne_besede_sl":["poroštvo","gospodarska pogodba","porok in plačnik"],"vir":{"literatura_str":"","zakon_clen":"OZ, 1019. člen; 13. člen; 1012. člen; 1016. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO1263"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T5-024","tema":"5 Obveznosti – odškodnina, zavarovanje, prenehanje, spremembe strank in stvarno pravo","podtema":"Zastavna pravica – pojem","tezina":1,"tip":"multi","vprasanje_sl":"Kaj velja za zastavno pravico po SPZ?","prevod_sr":"Šta važi za založno pravo po SPZ?","odgovori":[{"besedilo_sl":"Zastavitelj lahko ustanovi zastavno pravico samo za zavar va, osim ako zakon određuje drugačije; punovažna je ako je zaključena posle dospelosti (SPZ, 132. člen)."},{"besedilo_sl":"Za pridobitev hipoteke na podlagi pravnega posla se zahteva vpis v zemljiško knjigo.","prevod_sr":"Za sticanje hipoteke na osnovu pravnog posla zahteva se upis u zemljišnu knjigu.","pravilno":true,"razlaga_sr":"Tačno: SPZ, 141. člen, 1. odst."},{"besedilo_sl":"Hipoteka je zastavna pravica na nepremičninah.","prevod_sr":"Hipoteka je založno pravo na nepokretnostima.","pravilno":true,"razlaga_sr":"Tačno: SPZ, 138. člen."},{"besedilo_sl":"Ročna zastava nastane na podlagi veljavne zastavne pogodbe, ko zastavitelj izroči zastavljeno premičnino zastavnemu upniku v neposredno posest.","prevod_sr":"Ručna zaloga nastaje na osnovu punovažnog ugovora o zalozi kada zalogodavac preda založenu pokretnu stvar založnom poveriocu u neposrednu državinu.","pravilno":true,"razlaga_sr":"Tačno: SPZ, 155. člen, 1. odst."}],"kljucne_besede_sl":["hipoteka","ročna zastava","neposestna zastavna pravica","notarski zapis"],"vir":{"literatura_str":"","zakon_clen":"SPZ, 132. člen; 138. člen; 141. člen; 155. člen; 171. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO3242"},"poreklo":"generisano_po_gradivu","preverjeno":true},{"id":"T5-062","tema":"5 Obveznosti – odškodnina, zavarovanje, prenehanje, spremembe strank in stvarno pravo","podtema":"Služnosti","tezina":1,"tip":"multi","vprasanje_sl":"Kaj velja za služnosti po SPZ?","prevod_sr":"Šta važi za službenosti po SPZ?","odgovori":[{"besedilo_sl":"Služnost je pravica uporabljati tujo stvar ali izkoriščati pravico oziroma zahtevati od lastnika stvari, da opušča določena dejanja, ki bi jih sicer imel pravico izvrševati na svoji stvari.","prevod_sr":"Službenost je pravo upotrebljavati tuđu stvar ili iskorišćavati pravo, odnosno zahtevati od vlasnika stvari da se uzdržava od određenih radnji koje bi inače imao pravo da vrši na svojoj stvari.","pravilno":true,"razlaga_sr":"Tačno: SPZ, 210. člen."},{"besedilo_sl":"Osebna služnost, ustanovljena v korist pravne osebe, lahko traja največ deset let.","prevod_sr":"Lična službenost zasnovana u korist pravnog lica može trajati najviše deset godina.","pravilno":false,"razlaga_sr":"Netačno: ne sme trajati duže od trideset godina (SPZ, 227. člen, 2. odst.)."},{"besedilo_sl":"Osebne služnosti so užitek, raba in služnost stanovanja.","prevod_sr":"Lične službenosti su plodouživanje, upotreba i službenost stanovanja.","pravilno":true,"razlaga_sr":"Tačno: SPZ, 228. člen."},{"besedilo_sl":"Stvarna služnost lahko lastnika služeče nepremičnine obvezuje k nekemu dejanju.","prevod_sr":"Stvarna službenost može obavezivati vlasnika poslužne nepokretnosti na neko činjenje.","pravilno":false,"razlaga_sr":"Netačno: stvarna službenost ne može obavezivati vlasnika poslužne nepokretnosti na činjenje (SPZ, 213. člen, 2. odst.)."},{"besedilo_sl":"Osebna služnost traja tudi po imetnikovi smrti in preide na njegove dediče.","prevod_sr":"Lična službenost traje i posle smrti imaoca i prelazi na njegove naslednike.","pravilno":false,"razlaga_sr":"Netačno: lična službenost traje najduže do smrti imaoca (SPZ, 227. člen, 1. odst.)."}],"kljucne_besede_sl":["služnost","stvarna služnost","osebna služnost","užitek","služeča stvar"],"vir":{"literatura_str":"","zakon_clen":"SPZ, 210. člen; 213. člen; 227. člen; 228. člen","url":"https://pisrs.si/pregledPredpisa?id=ZAKO3242"},"poreklo":"generisano_po_gradivu","preverjeno":true}]</script>

"uradni list","prevod_sr":"službeni list (glasnik)","definicija_sl":"Uradni list je uradno glasilo, v katerem se objavljajo državni predpisi.","primer_sl":"Zakon je objavljen v Uradnem listu Republike Slovenije.","lazni_prijatelj":"da – uradni znači službeni, ne „urađen“","zakon_clen":"URS, 154. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"veljati","prevod_sr":"važiti","definicija_sl":"Predpis velja, ko je pravno obvezen.","primer_sl":"Predpis začne veljati petnajsti dan po objavi.","lazni_prijatelj":"ne","zakon_clen":"URS, 154. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"veljavnost","prevod_sr":"važenje, važnost","definicija_sl":"Veljavnost pomeni, da predpis ali pogodba pravno učinkuje.","primer_sl":"Ustava ureja veljavnost predpisov.","lazni_prijatelj":"ne","zakon_clen":"URS, 154. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"učinek za nazaj","prevod_sr":"povratno dejstvo, retroaktivnost","definicija_sl":"Učinek za nazaj pomeni, da bi predpis veljal za čas pred svojo uveljavitvijo. To praviloma ni dovoljeno.","primer_sl":"Zakoni ne morejo imeti učinka za nazaj.","lazni_prijatelj":"ne","zakon_clen":"URS, 155. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"javna korist","prevod_sr":"javni interes","definicija_sl":"Javna korist je korist celotne skupnosti. Je pogoj, da zakon izjemoma učinkuje za nazaj.","primer_sl":"Povratni učinek je dopusten le, če to zahteva javna korist.","lazni_prijatelj":"ne","zakon_clen":"URS, 155. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pridobljene pravice","prevod_sr":"stečena prava","definicija_sl":"To so pravice, ki jih je oseba že pridobila. Povratni učinek zakona vanje ne sme posegati.","primer_sl":"Zakon ne sme posegati v pridobljene pravice.","lazni_prijatelj":"ne","zakon_clen":"URS, 155. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"mednarodna pogodba","prevod_sr":"međunarodni ugovor","definicija_sl":"Mednarodna pogodba je sporazum med državami. Ratificirana in objavljena pogodba se uporablja neposredno.","primer_sl":"Zakoni morajo biti v skladu z mednarodno pogodbo.","lazni_prijatelj":"da – pogodba znači ugovor, ne „pogodba“ u smislu nagodbe ili pogotka","zakon_clen":"URS, 8. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"ratificirati","prevod_sr":"ratifikovati, potvrditi","definicija_sl":"Ratificirati pomeni uradno potrditi mednarodno pogodbo.","primer_sl":"Mednarodne pogodbe ratificira državni zbor.","lazni_prijatelj":"ne","zakon_clen":"URS, 86. člen; 3.a člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"delitev oblasti","prevod_sr":"podela vlasti","definicija_sl":"Oblast je razdeljena na zakonodajno, izvršilno in sodno.","primer_sl":"Slovenija temelji na načelu delitve oblasti.","lazni_prijatelj":"da – oblast znači vlast, ne geografska oblast","zakon_clen":"URS, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"zakonodajna oblast","prevod_sr":"zakonodavna vlast","definicija_sl":"Zakonodajna oblast sprejema zakone. Izvaja jo državni zbor.","primer_sl":"Državni zbor izvaja zakonodajno oblast.","lazni_prijatelj":"ne","zakon_clen":"URS, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"izvršilna oblast","prevod_sr":"izvršna vlast","definicija_sl":"Izvršilna oblast izvaja zakone. Njen glavni organ je vlada.","primer_sl":"Vlada je del izvršilne oblasti.","lazni_prijatelj":"ne","zakon_clen":"URS, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"sodna oblast","prevod_sr":"sudska vlast","definicija_sl":"Sodno oblast izvajajo sodniki na sodiščih.","primer_sl":"Sodno oblast izvajajo sodniki.","lazni_prijatelj":"ne","zakon_clen":"URS, 3. člen; ZS, 1. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"državni zbor","prevod_sr":"Državni zbor (parlament, skupština)","definicija_sl":"Državni zbor je zakonodajni organ. Šteje 90 poslancev in se voli za štiri leta.","primer_sl":"Državni zbor sprejema zakone.","lazni_prijatelj":"da – zbor nije hor ni skup, već naziv parlamenta","zakon_clen":"URS, 80. in 81. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"državni svet","prevod_sr":"Državni svet (drugi dom)","definicija_sl":"Državni svet zastopa socialne, gospodarske, poklicne in lokalne interese. Ima 40 članov.","primer_sl":"Državni svet lahko zahteva ponovno odločanje o zakonu.","lazni_prijatelj":"da – svet ovde znači savet/veće, ne svet (world)","zakon_clen":"URS, 96. in 97. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"poslanec","prevod_sr":"poslanik (narodni)","definicija_sl":"Poslanec je član državnega zbora.","primer_sl":"Zakon lahko predlaga vsak poslanec.","lazni_prijatelj":"ne","zakon_clen":"URS, 80. in 82. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"vlada","prevod_sr":"vlada","definicija_sl":"Vlado sestavljajo predsednik in ministri. Odgovorna je državnemu zboru.","primer_sl":"Vlada lahko predlaga zakon.","lazni_prijatelj":"ne","zakon_clen":"URS, 110. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"predsednik republike","prevod_sr":"predsednik republike","definicija_sl":"Predsednik republike predstavlja Slovenijo in razglaša zakone.","primer_sl":"Predsednik republike razglasi zakon v osmih dneh.","lazni_prijatelj":"ne","zakon_clen":"URS, 102. in 107. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"volivec","prevod_sr":"birač","definicija_sl":"Volivec je državljan, ki ima volilno pravico.","primer_sl":"Zakon lahko predloži najmanj pet tisoč volivcev.","lazni_prijatelj":"ne","zakon_clen":"URS, 88. in 90. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"razglasitev zakona","prevod_sr":"proglašenje zakona","definicija_sl":"Razglasitev je dejanje, s katerim predsednik republike potrdi, da je bil zakon sprejet.","primer_sl":"Razglasitev zakona je najkasneje 8 dni po sprejemu.","lazni_prijatelj":"ne","zakon_clen":"URS, 91. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"večina opredeljenih glasov","prevod_sr":"većina opredeljenih glasova (za ili protiv)","definicija_sl":"Štejejo samo glasovi za in proti. Vzdržani glasovi se ne štejejo.","primer_sl":"Zakon je sprejet z večino opredeljenih glasov navzočih poslancev.","lazni_prijatelj":"ne","zakon_clen":"URS, 86. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"dvotretjinska večina","prevod_sr":"dvotrećinska većina","definicija_sl":"To je večina dveh tretjin glasov.","primer_sl":"Za prenos suverenih pravic je potrebna dvotretjinska večina vseh poslancev.","lazni_prijatelj":"ne","zakon_clen":"URS, 3.a člen; 169. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"navzoč","prevod_sr":"prisutan","definicija_sl":"Navzoč je tisti, ki je na seji osebno prisoten.","primer_sl":"Na seji mora biti navzoča večina poslancev.","lazni_prijatelj":"ne","zakon_clen":"URS, 86. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"zakonodajni referendum","prevod_sr":"zakonodavni referendum","definicija_sl":"Na referendumu volivci odločajo o uveljavitvi zakona, ki ga je sprejel državni zbor.","primer_sl":"Referendum zahteva najmanj štirideset tisoč volivcev.","lazni_prijatelj":"ne","zakon_clen":"URS, 90. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"ustavno sodišče","prevod_sr":"ustavni sud","definicija_sl":"Ustavno sodišče odloča o skladnosti zakonov z ustavo in o ustavnih pritožbah.","primer_sl":"Ustavno sodišče je razveljavilo zakon.","lazni_prijatelj":"ne","zakon_clen":"URS, 160. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"ustavna pritožba","prevod_sr":"ustavna žalba","definicija_sl":"Ustavna pritožba je pravno sredstvo zaradi kršitve človekovih pravic s posamičnim aktom.","primer_sl":"Ustavno pritožbo vložimo, ko je izčrpano drugo pravno varstvo.","lazni_prijatelj":"da – pritožba znači žalba (pravni lek), ne „pritužba“","zakon_clen":"URS, 160. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"razveljaviti","prevod_sr":"ukinuti, poništiti (staviti van snage)","definicija_sl":"Razveljaviti pomeni določiti, da akt ne velja več.","primer_sl":"Ustavno sodišče protiustaven zakon razveljavi.","lazni_prijatelj":"ne","zakon_clen":"URS, 161. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"odpraviti","prevod_sr":"poništiti (sa dejstvom unazad), otkloniti","definicija_sl":"Odpraviti predpis pomeni odstraniti ga skupaj z njegovimi učinki.","primer_sl":"Ustavno sodišče lahko nezakonit predpis odpravi ali razveljavi.","lazni_prijatelj":"da – odpraviti ne znači „otpraviti/poslati“, nego ukloniti, poništiti","zakon_clen":"URS, 161. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"protiustaven","prevod_sr":"protivustavan, neustavan","definicija_sl":"Protiustaven je akt, ki ni v skladu z ustavo.","primer_sl":"Sodišče meni, da je zakon protiustaven.","lazni_prijatelj":"ne","zakon_clen":"URS, 156. in 161. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pravno pravilo","prevod_sr":"pravno pravilo, pravna norma","definicija_sl":"Pravno pravilo je obvezno pravilo ravnanja. Ima hipotezo, dispozicijo in sankcijo.","primer_sl":"Pravno pravilo določa tudi sankcijo.","lazni_prijatelj":"ne","zakon_clen":"","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"prisilni predpis","prevod_sr":"prinudni (kogentni) propis","definicija_sl":"Prisilni predpis je pravilo, ki ga stranke z dogovorom ne smejo spremeniti.","primer_sl":"Pogodba ne sme biti v nasprotju s prisilnimi predpisi.","lazni_prijatelj":"ne","zakon_clen":"OZ, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"dispozitivna določba","prevod_sr":"dispozitivna odredba","definicija_sl":"To je določba, od katere se stranke lahko dogovorijo drugače.","primer_sl":"Večina določb OZ je dispozitivnih.","lazni_prijatelj":"ne","zakon_clen":"OZ, 2. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pravna oseba","prevod_sr":"pravno lice","definicija_sl":"Pravna oseba je organizacija, ki je nosilec pravic in obveznosti, na primer družba ali zavod.","primer_sl":"Vse družbe so pravne osebe.","lazni_prijatelj":"da – oseba znači lice; pravna oseba = pravno lice","zakon_clen":"ZGD-1, 4. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"fizična oseba","prevod_sr":"fizičko lice","definicija_sl":"Fizična oseba je človek kot nosilec pravic in obveznosti.","primer_sl":"Pravdna stranka je lahko vsaka fizična in pravna oseba.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 76. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pravna sposobnost","prevod_sr":"pravna sposobnost","definicija_sl":"Pravna sposobnost je sposobnost biti nosilec pravic in obveznosti.","primer_sl":"Zavod pridobi pravno sposobnost z vpisom v sodni register.","lazni_prijatelj":"ne","zakon_clen":"ZZ, 12. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"poslovna sposobnost","prevod_sr":"poslovna sposobnost","definicija_sl":"Poslovna sposobnost je sposobnost, da oseba z lastnimi izjavami volje sklepa pravne posle.","primer_sl":"Za sklenitev pogodbe mora imeti pogodbenik poslovno sposobnost.","lazni_prijatelj":"ne","zakon_clen":"OZ, 41. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"zakoniti zastopnik","prevod_sr":"zakonski zastupnik","definicija_sl":"Zakoniti zastopnik zastopa osebo na podlagi zakona, na primer starši otroka.","primer_sl":"Pogodbo lahko pozneje odobri zakoniti zastopnik.","lazni_prijatelj":"da – zakoniti znači zakonski (po zakonu), ne „zakonit“ u smislu legalan","zakon_clen":"OZ, 41. člen; ZPP, 78. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"izpodbojna pogodba","prevod_sr":"rušljiv ugovor","definicija_sl":"Izpodbojna pogodba velja, dokler je upravičena oseba ne izpodbije.","primer_sl":"Pogodba omejeno poslovno sposobne osebe je izpodbojna.","lazni_prijatelj":"ne","zakon_clen":"OZ, 41. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"mladoletnik","prevod_sr":"maloletnik","definicija_sl":"Mladoletnik je oseba, ki še ni polnoletna.","primer_sl":"Mladoletnik do sedmega leta ne odgovarja za škodo.","lazni_prijatelj":"ne","zakon_clen":"OZ, 137. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"vpis v register","prevod_sr":"upis u registar","definicija_sl":"Z vpisom v register družba pridobi lastnost pravne osebe.","primer_sl":"Družba nastane z vpisom v register.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 5. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"gospodarska družba","prevod_sr":"privredno društvo","definicija_sl":"Gospodarska družba je pravna oseba, ki na trgu samostojno opravlja pridobitno dejavnost.","primer_sl":"Delniška družba je gospodarska družba.","lazni_prijatelj":"da – družba ovde znači društvo/kompanija, ne „družba“ kao društvo prijatelja; gospodarski = privredni","zakon_clen":"ZGD-1, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"zavod","prevod_sr":"ustanova","definicija_sl":"Zavod je organizacija za dejavnosti, katerih cilj ni pridobivanje dobička, na primer šola ali bolnišnica.","primer_sl":"Zavod je pravna oseba.","lazni_prijatelj":"da – zavod u slovenačkom znači ustanova (neprofitna organizacija), ne zavod u smislu instituta/biroa","zakon_clen":"ZZ, 1. in 4. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"sodišče","prevod_sr":"sud","definicija_sl":"Sodišče je državni organ, ki izvaja sodno oblast.","primer_sl":"Sodišče je odločilo o tožbi.","lazni_prijatelj":"ne","zakon_clen":"ZS, 1. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"okrajno sodišče","prevod_sr":"okrajni sud (najniži prvostepeni sud)","definicija_sl":"Okrajno sodišče sodi v manjših zadevah, na primer v sporih do 20.000 eurov.","primer_sl":"Pri okrajnem sodišču sodi sodnik posameznik.","lazni_prijatelj":"da – okrajno i okrožno su dva različita nivoa; okrajno je niže","zakon_clen":"ZS, 99. člen; ZPP, 30. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"okrožno sodišče","prevod_sr":"okružni sud","definicija_sl":"Okrožno sodišče sodi v večjih zadevah, na primer v gospodarskih sporih in v sporih nad 20.000 eurov.","primer_sl":"V gospodarskih sporih sodi okrožno sodišče.","lazni_prijatelj":"da – ne mešati sa okrajno sodišče; okrožno je više od okrajnog","zakon_clen":"ZS, 101. člen; ZPP, 32. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"višje sodišče","prevod_sr":"viši sud (apelacioni)","definicija_sl":"Višje sodišče odloča o pritožbah zoper odločbe okrajnih in okrožnih sodišč.","primer_sl":"O pritožbi odloča višje sodišče.","lazni_prijatelj":"ne","zakon_clen":"ZS, 104. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"Vrhovno sodišče","prevod_sr":"Vrhovni sud","definicija_sl":"Vrhovno sodišče je najvišje sodišče v državi.","primer_sl":"Vrhovno sodišče skrbi za enotno sodno prakso.","lazni_prijatelj":"ne","zakon_clen":"URS, 127. člen; ZS, 106. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"stvarna pristojnost","prevod_sr":"stvarna nadležnost","definicija_sl":"Stvarna pristojnost pove, katera vrsta sodišča odloča o zadevi.","primer_sl":"Stvarna pristojnost je odvisna od vrednosti spornega predmeta.","lazni_prijatelj":"da – pristojnost znači nadležnost, ne „pristojnost“ kao pristojno ponašanje","zakon_clen":"ZPP, 30. in 32. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"vrednost spornega predmeta","prevod_sr":"vrednost predmeta spora","definicija_sl":"To je denarna vrednost tistega, kar tožnik zahteva.","primer_sl":"Vrednost spornega predmeta presega 20.000 eurov.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 30., 32. in 39. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"premoženjskopravni zahtevek","prevod_sr":"imovinskopravni zahtev","definicija_sl":"To je zahtevek, ki se nanaša na premoženje, na primer plačilo denarja.","primer_sl":"Predmet arbitraže je lahko vsak premoženjskopravni zahtevek.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 30. člen; ZArbit, 4. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"gospodarski spor","prevod_sr":"privredni spor","definicija_sl":"Gospodarski spor je spor, v katerem sta obe stranki na primer gospodarski družbi, zavoda ali zadrugi.","primer_sl":"V gospodarskih sporih je pristojno okrožno sodišče.","lazni_prijatelj":"da – gospodarski znači privredni, ne „gospodarski“ kao gazdinski","zakon_clen":"ZPP, 481. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"spor majhne vrednosti","prevod_sr":"spor male vrednosti","definicija_sl":"To je spor za denarno terjatev do 2.000 eurov, v gospodarskih sporih do 4.000 eurov.","primer_sl":"V sporih majhne vrednosti ni revizije.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 443. in 495. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"motenje posesti","prevod_sr":"smetanje poseda (državine)","definicija_sl":"Motenje posesti je samovoljen poseg v posest druge osebe.","primer_sl":"V sporih zaradi motenja posesti sodi okrajno sodišče.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 30. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"tožba","prevod_sr":"tužba","definicija_sl":"Tožba je vloga, s katero se začne pravdni postopek.","primer_sl":"Tožena stranka je odgovorila na tožbo.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 180. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"tožena stranka","prevod_sr":"tužena stranka, tuženi","definicija_sl":"Tožena stranka je oseba, zoper katero je vložena tožba.","primer_sl":"Tožena stranka je ugovarjala pristojnosti sodišča.","lazni_prijatelj":"ne","zakon_clen":"ZPP, 47. člen; ZArbit, 11. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pritožba","prevod_sr":"žalba","definicija_sl":"Pritožba je redno pravno sredstvo zoper odločbo sodišča prve stopnje.","primer_sl":"O pritožbi odloča sodišče druge stopnje.","lazni_prijatelj":"da – pritožba znači žalba, ne „pritužba“","zakon_clen":"ZPP, 333. člen; ZS, 104. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"pravnomočna sodba","prevod_sr":"pravosnažna presuda","definicija_sl":"Pravnomočna sodba je sodba, ki je ni več mogoče izpodbijati s pritožbo.","primer_sl":"Arbitražna odločba ima učinek pravnomočne sodbe.","lazni_prijatelj":"da – sodba znači presuda; pravnomočen = pravosnažan","zakon_clen":"ZArbit, 38. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"arbitraža","prevod_sr":"arbitraža","definicija_sl":"Arbitraža je reševanje spora pred arbitri namesto pred sodiščem.","primer_sl":"Stranki sta se dogovorili za arbitražo.","lazni_prijatelj":"ne","zakon_clen":"ZArbit, 3. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"arbitražni sporazum","prevod_sr":"arbitražni sporazum (ugovor o arbitraži)","definicija_sl":"To je pisni sporazum strank, da bodo spor predložile arbitraži.","primer_sl":"Arbitražni sporazum mora biti sklenjen pisno.","lazni_prijatelj":"ne","zakon_clen":"ZArbit, 10. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"arbitražna klavzula","prevod_sr":"arbitražna klauzula","definicija_sl":"To je določba v pogodbi, da bo spore reševala arbitraža.","primer_sl":"Pogodba vsebuje arbitražno klavzulo.","lazni_prijatelj":"ne","zakon_clen":"ZArbit, 10. in 19. člen","tema":"1 Temeljni pravni pojmi in pravni sistem"},{"termin_sl":"arbitražna odločba","prevod_sr":"arbitražna odluka","definicija_sl":"To je odločitev arbitražnega senata o sporu. Med strankami ima učinek pravnomočne sodbe.","primer_sl":"Arbitražno odločbo je mogoče izpodbijati samo s tožbo za razveljavite ska družba.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 3. člen, 3. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"družba z neomejeno odgovornostjo","prevod_sr":"društvo sa neograničenom odgovornošću (ortačko društvo)","definicija_sl":"Osebna družba z oznako d.n.o. v firmi.","primer_sl":"Firma te družbe ima oznako d.n.o.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 3. člen, 3. odst.; 27. člen, 1. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"komanditna družba","prevod_sr":"komanditno društvo","definicija_sl":"Osebna družba z oznako k.d. Ima komplementarje in komanditiste.","primer_sl":"Komanditna družba ima vsaj enega komplementarja.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 3. člen, 3. odst.; 27. člen, 2. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"delniška družba","prevod_sr":"akcionarsko društvo","definicija_sl":"Kapitalska družba z oznako d.d. v firmi.","primer_sl":"Delniška družba ima v firmi oznako d.d.","lazni_prijatelj":"da – delnica je akcija, ne deonica puta ili deo","zakon_clen":"ZGD-1, 3. člen, 3. odst.; 27. člen, 4. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"družbenik","prevod_sr":"član društva (ortak)","definicija_sl":"Oseba, ki je članica družbe.","primer_sl":"Družbenik je izstopil iz družbe.","lazni_prijatelj":"da – nije drug ili saputnik nego član privrednog društva","zakon_clen":"ZGD-1, 5. člen, 2. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"komplementar","prevod_sr":"komplementar","definicija_sl":"Družbenik komanditne družbe, čigar priimek je lahko v firmi.","primer_sl":"Priimek komplementarja je v firmi.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 27. člen, 2. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"komanditist","prevod_sr":"komanditor","definicija_sl":"Družbenik komanditne družbe, čigar priimka ne sme biti v firmi.","primer_sl":"Komanditist ni naveden v firmi.","lazni_prijatelj":"ne","zakon_clen":"ZGD-1, 27. člen, 2. odst.; 41. člen, a","prevod_sr":"glavna knjiga (registra)","definicija_sl":"Del sodnega registra, v katerega se vpišejo in objavijo pravno pomembna dejstva.","primer_sl":"Podatki se vpišejo v glavno knjigo.","lazni_prijatelj":"ne","zakon_clen":"ZSReg, 2. člen, 2. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"zbirka listin","prevod_sr":"zbirka isprava","definicija_sl":"Del sodnega registra, v katerega se vložijo listine, ki so podlaga za vpis.","primer_sl":"Statut je v zbirki listin.","lazni_prijatelj":"da – listina je isprava (dokument), ne list papira ili lista","zakon_clen":"ZSReg, 2. člen, 3. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"subjekt vpisa","prevod_sr":"subjekt upisa","definicija_sl":"Pravna oseba ali podružnica, ki se vpiše v sodni register.","primer_sl":"Zadruga je subjekt vpisa.","lazni_prijatelj":"ne","zakon_clen":"ZSReg, 3. člen","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"objava vpisa","prevod_sr":"objava upisa","definicija_sl":"Javna objava vpisa na spletnih straneh AJPES. Od tega dne vpis učinkuje nasproti tretjim.","primer_sl":"Vpis učinkuje od dneva objave vpisa.","lazni_prijatelj":"ne","zakon_clen":"ZSReg, 8. in 43. člen; ZGD-1, 3. člen, 7. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"javna knjiga","prevod_sr":"javna knjiga","definicija_sl":"Knjiga, v katero lahko vsakdo vpogleda.","primer_sl":"Sodni register je javna knjiga.","lazni_prijatelj":"ne","zakon_clen":"ZSReg, 7. člen, 1. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"vpogled","prevod_sr":"uvid","definicija_sl":"Možnost, da kdo pogleda podatke v registru.","primer_sl":"Vpogled v sodni register je brezplačen.","lazni_prijatelj":"ne","zakon_clen":"ZSReg, 7. člen, 2. odst.","tema":"2 Statusno pravo – splošni del"},{"termin_sl":"izpis iz sodnega registra","prevod_sr":"izvod iz sudskog registra","definicija_sl":"Listina s podatki, ki so o subjektu vpisani v sodni register.","primer_sl":"Banka zahteva izpis iz sodnega registra.",
